#menub{display:none}

['SM TiMatrix سے ڈیٹا لیں (پہلا کام)','Load data from SM TiMatrix (first step)','تحميل البيانات من SM TiMatrix (الخطوة الأولى)','ٹائم ٹیبل انچارج پہلے TiMatrix میں سب کچھ بنا لیتا ہے اور امتحانی انچارج کو ایک چھوٹی فائل دیتا ہے، اس لیے سارا ڈیٹا دوبارہ نہیں لکھنا پڑتا۔<br>1. "ڈیٹا اور زبان" کھولیں۔<br>2. "TiMatrix / مشترکہ فائل لوڈ کریں" دبائیں۔<br>3. TiMatrix کی فائل منتخب کریں۔<br>4. کلاسیں، مضامین (کوڈ سمیت)، اساتذہ، کمرے اور ادارے کا نام آ جائیں گے۔ اب صرف طلبہ کی تعداد اور کمروں کی گنجائش بھریں۔<br>بعد میں ٹائم ٹیبل میں کوئی تبدیلی ہو تو نئی فائل لوڈ کر لیں: نئے اندراجات شامل اور موجود اپ ڈیٹ ہو جائیں گے، مگر آپ کے امتحانات، تاریخیں اور ڈیوٹیاں نہیں بدلیں گی۔ مضمون کا کوڈ اختیاری ہے۔ کوڈ ہو تو اسی سے مضمون پہچانا جاتا ہے؛ نہ ہو تو نام کے ساتھ کلاس/سمسٹر بھی ملا کر دیکھا جاتا ہے، کیونکہ ایک نام کا مضمون مختلف سمسٹروں اور پروگراموں میں ہو سکتا ہے۔','The timetable in-charge builds everything in TiMatrix first and hands the exam in-charge a small file, so nothing has to be typed again.<br>1. Open "Data & Language".<br>2. Press "Load TiMatrix / shared file".<br>3. Choose the TiMatrix file.<br>4. Classes, subjects (with codes), teachers, rooms and the institution name arrive. Now only enter the student counts and room capacities.<br>If the timetable changes later, load the new file: new records are added and existing ones updated, but your exams, dates and duties are not changed. A subject code is optional. When present it identifies the subject; when absent, the name is checked together with the class/semester, because one subject name can appear in different semesters and programs.','يُنشئ مسؤول الجدول كل شيء في TiMatrix أولاً ويسلّم مسؤول الامتحانات ملفاً صغيراً، فلا حاجة لإعادة الكتابة.<br>1. افتح «البيانات واللغة».<br>2. اضغط «تحميل ملف TiMatrix / مشترك».<br>3. اختر ملف TiMatrix.<br>4. تصل الصفوف والمواد (مع الرموز) والمدرّسون والقاعات واسم المؤسسة. أدخل الآن أعداد الطلاب وسعة القاعات فقط.<br>وإذا تغيّر الجدول لاحقاً فحمّل الملف الجديد: تُضاف السجلات الجديدة وتُحدَّث القائمة، دون تغيير امتحاناتك وتواريخك ومناوباتك. رمز المادة اختياري؛ إن وُجد عُرفت به المادة، وإلا فُحص الاسم مع الصف/الفصل، لأن الاسم الواحد قد يتكرر في فصول وبرامج مختلفة.','dat'],
['ادارے کا نام اور لوگو','Institution names and logos','اسم المؤسسة والشعارات','"ادارہ" میں یونیورسٹی اور شعبہ کا نام اردو، English اور عربی میں لکھیں اور چاہیں تو لوگو شامل کریں۔ یہ نام اور لوگو پرنٹ، PDF اور Word کے اوپر آتے ہیں۔ جو زبان خالی ہو اس کی جگہ دوسری زبان کا نام آ جاتا ہے۔','Under "Institution" type the university and department names in Urdu, English and Arabic, and add logos if you like. They appear at the top of print, PDF and Word. If one language is empty, another language is used instead.','في «المؤسسة» اكتب اسم الجامعة والقسم بالأردية والإنجليزية والعربية وأضف الشعارات إن شئت؛ يظهر ذلك أعلى الطباعة وPDF وWord. وإذا خلت لغة استُخدمت لغة أخرى.','inst'],
['امتحانی سیشن بنائیں','Create the exam session','أنشئ الدورة الامتحانية','نام، قسم (Midterm، Final وغیرہ)، تعلیمی سیشن، آغاز و اختتام کی تاریخیں، غیر امتحانی دن (جمعہ وغیرہ) اور تعطیلات درج کریں۔ ہر سیشن کا امتحانی ڈیٹا الگ رہتا ہے؛ نیا سیشن بنانے یا موجودہ کی نقل بنانے کا بٹن بھی یہیں ہے۔','Enter the name, type (Midterm, Final, etc.), academic session, start and end dates, non-exam days (e.g. Friday) and holidays. Every session keeps its own exam data; you can also add a new session or duplicate the current one here.','أدخل الاسم والنوع (نصفي، نهائي...) والعام الدراسي وتاريخي البداية والنهاية وأيام العطلة والإجازات. لكل دورة بياناتها الخاصة، ويمكنك هنا إضافة دورة جديدة أو نسخ الحالية.','ses'],
['کلاسیں اور پروگرام','Classes and programs','الصفوف والبرامج','پروگرام (BS، MA، MSc، MPhil، PhD) اور کلاسیں/سمسٹر شامل کریں۔ "BS سمسٹر 1 تا 8" کا بٹن سب ایک ساتھ بنا دیتا ہے۔ ہر کلاس کے طلبہ کی تعداد لکھیں تاکہ کمرے کی گنجائش جانچی جا سکے۔','Add programs (BS, MA, MSc, MPhil, PhD) and classes/semesters. The "BS semesters 1-8" button creates them at once. Enter each class\'s student count so room capacity can be checked.','أضف البرامج (BS وMA وMSc وMPhil وPhD) والصفوف/الفصول؛ وزر «فصول BS من 1 إلى 8» ينشئها دفعة واحدة. اكتب عدد طلاب كل صف لفحص سعة القاعات.','cls'],
['مضامین','Subjects','المواد','ہر مضمون کا نام، کوڈ (اختیاری؛ مدارس اور سکولوں میں نہ ہو تو خالی چھوڑیں)، پروگرام/کلاسیں، دورانیہ، نمبر، ممتحن اور "مشکل / اہم" کا نشان لکھیں۔ کلاس منتخب کرنے پر صرف اسی کے مضامین دکھتے ہیں۔ مشکل / اہم مضامین کے پرچوں کے درمیان خودکار شیڈیول زیادہ وقفہ رکھتا ہے۔','Enter each subject\'s name, code (optional; leave it empty if you have none), program/classes, duration, marks, examiner and the "Difficult / important" flag. Choosing a class shows only its subjects. The auto scheduler leaves more gap between difficult / important papers.','أدخل لكل مادة الاسم والرمز (اختياري، اتركه فارغاً إن لم يوجد) والبرنامج/الصفوف والمدة والدرجات والممتحن وعلامة «صعبة / مهمة». عند اختيار صف تظهر موادّه فقط، وتترك الجدولة التلقائية فاصلاً أكبر بين أوراق المواد الصعبة/المهمة.','sub'],
['اساتذہ','Teachers','المدرّسون','اساتذہ کے نام اردو، English اور عربی میں لکھیں۔ فہرست میں اوپر نیچے کی ترتیب ڈیوٹی کی فہرست میں بھی وہی رہتی ہے۔ کسی استاد پر کلک کر کے اس کی دستیابی اور مصروفیت دیکھی جا سکتی ہے۔','Add teachers with Urdu, English and Arabic names. The order in the list is also the order in the duty list. Click a teacher to see availability and schedule.','أضف المدرّسين بأسمائهم بالأردية والإنجليزية والعربية؛ ويُتبع ترتيبهم في القائمة في قائمة المناوبات. انقر على مدرّس لرؤية توفره وجدوله.','tch'],
['امتحانی کمرے','Exam rooms','القاعات الامتحانية','کمرے اور ہال گنجائش کے ساتھ درج کریں۔ جو کمرہ عارضی طور پر بند ہو اس کی "دستیاب" کی علامت ہٹا دیں۔ "کمروں کی دستیابی جانچیں" سے کسی تاریخ اور وقت پر خالی کمرے دیکھیں۔','Add rooms and halls with capacity. Untick "Available" for a room that is temporarily out of use. "Check room availability" shows free rooms for a date and time.','أضف القاعات بسعتها، وألغِ «متاحة» للقاعة المغلقة مؤقتاً. وبـ «فحص توفر القاعات» ترى القاعات الفارغة في تاريخ ووقت.','rms'],
['امتحانات بنائیں','Create exams','أنشئ الامتحانات','"مضامین سے امتحانات بنائیں" سے چنی ہوئی کلاسوں کے تمام مضامین کے امتحانات بن جاتے ہیں؛ یا ایک ایک امتحان شامل کریں۔ تاریخ چنتے ہی دن خود آ جاتا ہے اور دورانیہ خود شمار ہوتا ہے۔ قفل لگا دیں تو وہ امتحان خودکار شیڈیول نہیں بدلتا۔','"Create exams from subjects" makes exams for all subjects of the chosen classes, or add them one by one. The weekday appears automatically and the duration is calculated. Lock an exam and the auto scheduler will not move it.','«إنشاء امتحانات من المواد» ينشئ امتحانات كل مواد الصفوف المختارة، أو أضفها واحداً واحداً. يظهر اليوم وتُحسب المدة تلقائياً. وإذا قفلت امتحاناً لم تغيّره الجدولة التلقائية.','exm'],
['خودکار شیڈیول','Auto scheduler','الجدولة التلقائية','شرائط (روزانہ حد، پرچوں کے درمیان خالی دن، مشکل مضامین، وقفہ، آغاز کے اوقات، کمرے) طے کر کے "پیش منظر" دیکھیں اور پسند آنے پر محفوظ کریں۔ پہلے سے مقرر شدہ امتحانات بغیر اجازت نہیں بدلتے۔ جو امتحان نہ لگ سکے اس کی وجہ ساتھ لکھی آتی ہے۔','Set the rules (daily limit, free days between papers, difficult papers, break, start times, rooms), review the preview and save. Existing scheduled exams are never changed without your permission. If an exam cannot be placed, the reason is shown.','حدّد الشروط (الحد اليومي والأيام الفاصلة والمواد الصعبة والاستراحة وأوقات البدء والقاعات) وراجع المعاينة ثم احفظ. لا تتغير الامتحانات القائمة دون إذنك، ويُذكر سبب تعذّر أي امتحان.','gen'],
['ٹکراؤ کی جانچ اور درستی','Conflict check and fixing','فحص التعارض ومعالجته','کلاس، کمرے، ممتحن، گنجائش، تعطیل، وقفے اور ڈیوٹی کے مسائل ہر پیغام کے ساتھ دکھتے ہیں۔ "متبادل" دبائیں تو تاریخ، وقت اور کمرے کی تجاویز ملتی ہیں؛ "غلطیاں خود حل کریں" سے ممکنہ مسائل خود ٹھیک ہوتے ہیں اور غلطی ہو تو واپس لے سکتے ہیں۔','Class, room, examiner, capacity, holiday, gap and duty problems are listed with each message. Press "alternatives" for date, time and room suggestions; "Auto-fix errors" tries to fix them for you, and you can undo it.','تُعرض مشاكل الصف والقاعة والممتحن والسعة والعطل والفواصل والمناوبات مع كل رسالة. اضغط «بدائل» لاقتراحات التاريخ والوقت والقاعة، و«إصلاح الأخطاء تلقائياً» يحاول معالجتها ويمكنك التراجع عنه.','cfl'],
['نگران ڈیوٹی (اختیاری)','Invigilation duty (optional)','مناوبات المراقبة (اختياري)','یہ حصہ اختیاری ہے؛ اس کے بغیر بھی شیڈیول مکمل کام کرتا ہے۔ اسے آن کر کے فی کمرہ نگران اساتذہ کی تعداد لکھیں، ہر مضمون کے استاد کے لیے طے کریں کہ وہ اپنے مضمون میں ڈیوٹی کرے گا یا نہیں، پھر "خودکار ڈیوٹی لگائیں" دبائیں۔ ایک استاد ایک وقت میں دو جگہ ڈیوٹی پر نہیں لگتا۔','This part is optional; the schedule works fully without it. Turn it on, enter the number of invigilators per room, set for each subject teacher whether they do duty in their own subject, then press "Auto-assign duties". A teacher is never put on duty in two places at once.','هذا القسم اختياري، والجدول يعمل كاملاً بدونه. فعّله واكتب عدد المراقبين لكل قاعة وحدّد لكل مدرّس مادة هل يراقب في مادته، ثم اضغط «مناوبات تلقائية». ولا يُكلَّف المدرّس بمكانين في وقت واحد.','inv'],
['ویوز، سیٹنگ پلان، پرنٹ، PDF اور Word','Views, seating plan, print, PDF and Word','العروض وترتيب المقاعد والطباعة','مکمل، روزانہ، ہفتہ وار، کلاس، پروگرام/سمسٹر، مضمون، کمرہ اور نگران ویو چنیں؛ پرنٹ پریویو دیکھ کر پرنٹ کریں، PDF (Save as PDF) یا Word میں محفوظ کریں۔ "نشستوں کی ترتیب" اختیاری ہے: کمروں کے لحاظ سے بیٹھنے کا نقشہ بنتا ہے، کلاسیں ملا کر یا الگ الگ بٹھا سکتے ہیں اور رول نمبر بھی لکھ سکتے ہیں۔','Pick the full, daily, weekly, class, program/semester, subject, room or invigilator view; preview, print, or save as PDF (Save as PDF) or Word. The "Seating plan" is optional: it draws a seating map per room, with classes mixed or kept apart, and you can enter roll numbers.','اختر العرض: كامل أو يومي أو أسبوعي أو حسب الصف أو البرنامج أو المادة أو القاعة أو المراقب؛ ثم عاين واطبع أو احفظ PDF أو Word. و«ترتيب المقاعد» اختياري: يرسم خريطة جلوس لكل قاعة بخلط الصفوف أو فصلها، ويمكنك إدخال أرقام التسجيل.','vw'],
['بیک اپ اور ری اسٹور: قدم بہ قدم','Backup and restore: step by step','النسخ الاحتياطي والاستعادة خطوة بخطوة','بیک اپ لینا:<br>1. "ڈیٹا اور زبان" کھولیں۔<br>2. "بیک اپ" دبائیں۔<br>3. فائل (SM-ExaMatrix-backup…) محفوظ جگہ (USB، ای میل، گوگل ڈرائیو) میں رکھ لیں۔<br>ری اسٹور کرنا:<br>1. "ڈیٹا اور زبان" کھولیں۔<br>2. "ری اسٹور" دبائیں۔<br>3. بیک اپ فائل منتخب کریں۔<br>4. تصدیق کریں۔ موجودہ ڈیٹا بدل جائے گا، اس لیے پہلے نیا بیک اپ لے لیں۔<br>ڈیٹا آپ کے براؤزر میں خود محفوظ ہوتا ہے، مگر براؤزر کا ڈیٹا صاف کرنے سے مٹ جاتا ہے، اس لیے باقاعدگی سے بیک اپ لیں۔ ایک سیشن یا مشترکہ ڈیٹا الگ بھیجنا ہو تو "ایکسپورٹ / امپورٹ" کے بٹن استعمال کریں۔','Backup:<br>1. Open "Data & Language".<br>2. Press "Backup".<br>3. Keep the file (SM-ExaMatrix-backup…) somewhere safe (USB, email, Google Drive).<br>Restore:<br>1. Open "Data & Language".<br>2. Press "Restore".<br>3. Choose the backup file.<br>4. Confirm. Current data will be replaced, so take a fresh backup first.<br>Data autosaves in your browser but is erased if you clear browser data, so back up regularly. To send one session or only the shared data, use the "Export / import" buttons.','النسخ الاحتياطي:<br>1. افتح «البيانات واللغة».<br>2. اضغط «نسخ احتياطي».<br>3. احفظ الملف (SM-ExaMatrix-backup…) في مكان آمن (USB أو البريد أو Google Drive).<br>الاستعادة:<br>1. افتح «البيانات واللغة».<br>2. اضغط «استعادة».<br>3. اختر ملف النسخة.<br>4. أكّد. ستُستبدل البيانات الحالية، فخذ نسخة جديدة أولاً.<br>تُحفظ البيانات تلقائياً في المتصفح لكنها تُمحى بمسح بيانات المتصفح، فاحفظ نسخة دورياً. ولإرسال دورة واحدة أو البيانات المشتركة فقط استخدم أزرار «تصدير / استيراد».','dat'],
['انسٹال اور آف لائن استعمال','Install and offline use','التثبيت والعمل دون إنترنت','براؤزر اجازت دے تو "انسٹال کریں" کا بٹن آتا ہے۔ انسٹال کرنے کے بعد پروگرام موبائل یا کمپیوٹر کی ایپ کی طرح انٹرنیٹ کے بغیر چلتا ہے۔ آپ کا ڈیٹا آپ کے اپنے آلے میں رہتا ہے، اور نیا ورژن آنے پر خود بخود آ جاتا ہے۔','When your browser allows it, an "Install" button appears. Once installed, the program runs like a phone or computer app, even without internet. Your data stays on your own device, and new versions arrive automatically.','عندما يسمح المتصفح يظهر زر «تثبيت». بعد التثبيت يعمل البرنامج كتطبيق على الهاتف أو الحاسوب حتى دون إنترنت. وتبقى بياناتك على جهازك، وتصل الإصدارات الجديدة تلقائياً.','dash']];

function conflicts(){const S=ses(),G=S.gen,X=S.exams.filter(act),out=[],O=ordMap(S);

  if(a.cid==b.cid)add('class','err',[a.id,b.id],t('c_class',exLbl(a),exLbl(b),dshow(a.date),tm12(a.st)));
  const ea=exTid(a);if(ea&&ea==exTid(b))add('exm','err',[a.id,b.id],t('c_exm',nm(teach(ea)),exLbl(a),exLbl(b)))}
 const seenG=new Set();sch.forEach(x=>{if(!x.room)return;const g=rgrp(S,x);if(g.length<2)return;const k=g.map(o=>o.id).sort().join();if(seenG.has(k))return;seenG.add(k);const r=room(x.room),tot=g.reduce((a,o)=>a+stuN(o),0),nmz=g.map(exLbl).join(' + ');
  if(r&&r.cap&&tot<=r.cap)add('rshare','warn',g.map(o=>o.id),t('c_rshare',r.name,nmz,tot,r.cap));else add('room','err',g.map(o=>o.id),r&&r.cap?t('c_rover',r.name,nmz,tot,r.cap):t('c_room',roomName(x.room),exLbl(g[0]),exLbl(g[1]),dshow(x.date),tm12(x.st)))});
 const byC={};sch.forEach(x=>(byC[x.cid]=byC[x.cid]||[]).push(x));
 Object.values(byC).forEach(a=>{a.sort(cmpEx);for(let i=0;i+1<a.length;i++){const p=a[i],q=a[i+1];
  if(p.date==q.date){if(!ovl(p,q)){const g=mn(q.st)-mn(p.en);if(g<G.minBreak)add('brk','warn',[p.id,q.id],t('c_brk',exLbl(p),exLbl(q),g,G.minBreak))}}
  else{const g=gapBetween(O,p.date,q.date),need=G.gapDays+((isHard(p)&&isHard(q))?G.hardExtra:0);if(g<need)add('gap','warn',[p.id,q.id],t('c_gap',exLbl(p),exLbl(q),g,need))}}});
 if(S.useInv){const byT={};S.duties.forEach(d=>{const x=sch.find(y=>y.id==d.eid);if(x&&!(byT[d.tid]||[]).includes(x))(byT[d.tid]=byT[d.tid]||[]).push(x)});
  if(S.duties.length){const sg=new Set();sch.forEach(x=>{const g=rgrp(S,x),key=g.map(o=>o.id).sort().join();if(sg.has(key))return;sg.add(key);const u=new Set(S.duties.filter(d=>g.some(o=>o.id==d.eid)).map(d=>d.tid)).size,N=S.invN||2;if(u<N)add('dshort','warn',g.map(o=>o.id),t('c_dshort',g.map(exLbl).join(' + '),u,N))})}
  Object.keys(byT).forEach(tid=>{const a=byT[tid];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(ovl(a[i],a[j])&&!(a[i].room&&a[i].room==a[j].room))add('duty','err',[a[i].id,a[j].id],t('c_duty',nm(teach(tid)),exLbl(a[i]),exLbl(a[j])),{tid})})}

function dutyCore(S){const N=S.invN||2,T=CORE.teachers;if(!T.length)return null;const cnt={};T.forEach(a=>{cnt[a.id]=S.duties.filter(d=>d.tid==a.id).length});let add=0,miss=0;const done=new Set(),G=[];
 S.exams.filter(x=>act(x)&&okEx(x)).sort(cmpEx).forEach(x=>{if(done.has(x.id))return;const g=rgrp(S,x);g.forEach(o=>done.add(o.id));G.push({x,g})});
 const have=g=>[...new Set(S.duties.filter(d=>g.some(o=>o.id==d.eid)).map(d=>d.tid))],give=(g,tid)=>{g.forEach(o=>{if(!S.duties.some(d=>d.eid==o.id&&d.tid==tid))S.duties.push({id:uid(),eid:o.id,tid})});cnt[tid]=(cnt[tid]||0)+1;add++},free=(g,tid)=>g.every(o=>tFree(S,tid,o));
 G.forEach(({g})=>g.forEach(o=>{const sb=sOf(o),rt=sb&&sb.dutyReq?exTid(o):'';if(rt&&T.some(a=>a.id==rt)&&!have(g).includes(rt)){if(free(g,rt))give(g,rt);else miss++}}));
 for(let r=1;r<=N;r++)G.forEach(({g})=>{if(have(g).length>=r)return;const c=T.filter(a=>!have(g).includes(a.id)&&!g.some(o=>exTid(o)==a.id)&&free(g,a.id)).sort((a,b)=>cnt[a.id]-cnt[b.id])[0];if(c)give(g,c.id)});
 G.forEach(({g})=>{if(have(g).length<N)miss++});
 S.duties.sort((a,b)=>tIdx(a.tid)-tIdx(b.tid));return{add,miss}}

function mergeSh(sh,upd){const lc=v=>String(v||'').trim().toLowerCase(),mp={classes:{},teachers:{},rooms:{}},key={classes:x=>lc(x.name)+'|'+lc(x.prog),teachers:x=>lc(x.name),rooms:x=>lc(x.name)};let n=0;
 ['classes','teachers','rooms'].forEach(k=>{(sh[k]||[]).forEach(o=>{if(!o||!o.id)return;const d=CORE[k].find(x=>x.id==o.id)||CORE[k].find(x=>key[k](x)==key[k](o));
  if(d){mp[k][o.id]=d.id;if(upd){const ch=['name','en','ar'].concat(k=='classes'?['prog']:[]).filter(f=>o[f]!==undefined&&o[f]!==d[f]);ch.forEach(f=>d[f]=o[f]);if(ch.length)n++}}
  else{CORE[k].push(o);mp[k][o.id]=o.id;n++}})});

 (sh.subjects||[]).forEach(o=>{if(!o||!o.id)return;const cids=(o.cids||[]).map(i=>mp.classes[i]||i),tid=o.tid?(mp.teachers[o.tid]||o.tid):'';
